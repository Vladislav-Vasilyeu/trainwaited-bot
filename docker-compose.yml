services:
  trainwaited-bot:
    build: .
    container_name: trainwaited-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - trainwaited-data:/app/data
    environment:
      - SUBSCRIPTIONS_FILE=/app/data/subscriptions.json
      - HEADLESS=true
      - BROWSER=firefox

volumes:
  trainwaited-data:
